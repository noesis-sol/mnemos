name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # onnxruntime-node (through the optional @huggingface/transformers)
      # downloads its CUDA provider on linux/x64 at install; the tests never
      # load the real model, so skip it.
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - run: npm test
      # Guard the publishable artifact: pack, unpack, check dist + the bin
      # target, and start the server through the bin.
      - run: node --test e2e/package.e2e.js
