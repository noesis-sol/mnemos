[project]
name = "bookmarks-mcp"
version = "0.1.0"
description = "MCP server exposing local Chrome bookmarks (read-only)"
requires-python = ">=3.11"
dependencies = ["mcp>=1.2.0"]

[project.scripts]
bookmarks-mcp = "bookmarks_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["bookmarks_mcp.py"]
